name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # מזריק את פרטי הבוט מ-Secrets לתוך config.js בזמן הבנייה.
      # הערכים לא יושבים ב-repo ולא בהיסטוריה — רק בארטיפקט שנפרס.
      - name: Inject Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — deploying with tracking off."
            node --check config.js
            exit 0
          fi

          # ניקוי רווחים/שורות חדשות שנדבקו בטעות בהעתקה לתוך ה-Secret
          TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          export TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID

          # בדיקת צורה — מאבחנת ערכים מוחלפים או הדבקה חלקית בלי לחשוף את הערך.
          # (GitHub ממסך את ערך הסוד בלוג; אורך בלבד אינו מסגיר אותו.)
          if ! printf '%s' "$TELEGRAM_BOT_TOKEN" | grep -qE '^[0-9]{6,12}:[A-Za-z0-9_-]{30,}$'; then
            echo "::error::TELEGRAM_BOT_TOKEN בצורה שגויה (אורך=${#TELEGRAM_BOT_TOKEN})."
            echo "::error::מצופה <ספרות>:<35+ תווים>. בדוק שלא התחלפו הערכים בין שני הסודות ושלא הודבק רק חלק מהטוקן."
            exit 1
          fi
          if ! printf '%s' "$TELEGRAM_CHAT_ID" | grep -qE '^-?[0-9]+$'; then
            echo "::error::TELEGRAM_CHAT_ID בצורה שגויה (אורך=${#TELEGRAM_CHAT_ID}) — מצופות ספרות בלבד."
            exit 1
          fi

          node - <<'EOF'
          const fs = require("fs");
          const file = "config.js";
          const js = (s) => JSON.stringify(String(s));
          let src = fs.readFileSync(file, "utf8");
          const before = src;

          // פונקציית החלפה (ולא מחרוזת) — כדי ש-$ בערך לא יפורש כ-$&/$' ע"י replace
          src = src.replace(/(botToken:\s*)"[^"]*"/, function (m, p1) {
            return p1 + js(process.env.TELEGRAM_BOT_TOKEN);
          });
          src = src.replace(/(chatId:\s*)"[^"]*"/, function (m, p1) {
            return p1 + js(process.env.TELEGRAM_CHAT_ID);
          });

          if (src === before) {
            console.error("ERROR: botToken/chatId placeholders not found in config.js");
            process.exit(1);
          }
          fs.writeFileSync(file, src);
          EOF

          node --check config.js
          if grep -q 'botToken: ""' config.js; then
            echo "::error::injection ran but botToken is still empty"
            exit 1
          fi
          echo "Telegram credentials injected into config.js"

      # שובר מטמון: כל דיפלוי מקבל ?v=<sha> ייחודי, כך שדפדפן שכבר ביקר
      # בדף לא מגיש גרסה ישנה של app.js/styles.css.
      - name: Cache-bust asset URLs
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:7}/g" index.html
          if grep -q '?v=dev' index.html; then
            echo "::error::cache-bust failed — ?v=dev still present"; exit 1
          fi
          grep -o '?v=[a-z0-9]\{7\}' index.html | sort -u

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # בדיקת שפיות לבוט — שולח הודעת אימות אחרי כל דיפלוי.
      # תופס מראש את שלושת הכשלים הנפוצים: טוקן שגוי, chat_id שגוי,
      # ובוט שלא לחצו עליו Start (טלגרם חוסם שליחה יזומה למשתמש).
      - name: Verify Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set — skipping bot verification."
            exit 0
          fi

          # אותו ניקוי כמו בשלב ההזרקה — env לא עובר בין שלבים
          TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"

          TEXT="🤖 בדיקת מערכת — הבוט עובד.

          האתר באוויר: ${PAGE_URL}
          commit: ${GITHUB_SHA:0:7}

          מכאן והלאה תקבל כאן התראה על כל צעד בתהליך."

          RESP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}")

          if echo "$RESP" | grep -q '"ok":true'; then
            echo "✅ Telegram verified — test message delivered."
            exit 0
          fi

          DESC=$(echo "$RESP" | sed -n 's/.*"description":"\([^"]*\)".*/\1/p')
          echo "::error::Telegram verification FAILED: ${DESC:-$RESP}"
          case "$DESC" in
            *"initiate conversation"*|*"chat not found"*)
              echo "::error::פתח את הצ'אט עם הבוט בטלגרם, לחץ Start, והרץ מחדש (Re-run jobs)." ;;
            *Unauthorized*)
              echo "::error::TELEGRAM_BOT_TOKEN שגוי, או שהבוט נמחק ב-BotFather." ;;
          esac
          exit 1
